<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Jargon Decoder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6f8;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .subtitle { color: #6b7280; margin-bottom: 20px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 24px;
  }
  textarea {
    width: 100%;
    min-height: 150px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
    margin-bottom: 14px;
  }
  button.action {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #9333ea;
    color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.85rem; color: #6b7280; min-height: 1.2em; }
  .result-box {
    margin-top: 18px;
    padding: 16px;
    background: #faf5ff;
    border: 1px solid #e9d5ff;
    border-radius: 10px;
    display: none;
  }
  .result-body { font-size: 1rem; line-height: 1.6; color: #1f2937; white-space: pre-wrap; }
  .footer-note { color: #9ca3af; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #e9d5ff;
    border-top-color: #9333ea;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Jargon Decoder</h1>
    <p class="subtitle">Paste a jargon-heavy sentence, get a plain-English version. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. We need to leverage synergies to operationalize our core value proposition..."></textarea>
      <button class="action" id="generateBtn">Decode It</button>
      <div class="status" id="status"></div>
      <div class="result-box" id="resultBox">
        <div class="result-body" id="resultBody"></div>
      </div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const resultBody = document.getElementById('resultBody');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.style.display = 'none';
      status.innerHTML = '<span class="spinner"></span>Decoding...';

      try {
        const res = await fetch('/api/decode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBody.textContent = data.plain;
        resultBox.style.display = 'block';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
